services:
  slskd-bot:
    build: .

    container_name: slskd-bot

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./message.txt.example:/app/message.txt.example:ro
    networks:
      - media-stack

networks:
  media-stack:
    external: true
